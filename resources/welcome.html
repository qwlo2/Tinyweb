<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My 云盘 - 欢迎</title>
    <link rel="icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/magnific-popup.css">
    <link rel="stylesheet" href="/css/font-awesome.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --portal-blue: #2f6fed;
            --portal-blue-dark: #245bd0;
            --portal-text: #17233d;
            --portal-muted: #69758a;
            --portal-line: #e5eaf2;
            --portal-bg: #f3f6fb;
        }

        body.portal-page { min-height: 100vh; background: var(--portal-bg); color: var(--portal-text); }
        .portal-page .custom-navbar { background: rgba(255, 255, 255, 0.98); box-shadow: 0 10px 32px rgba(38, 58, 96, 0.08); }
        .portal-page .custom-navbar .navbar-brand { color: var(--portal-text); font-weight: 700; }
        .portal-page .custom-navbar .nav li a { color: var(--portal-muted); font-weight: 600; }
        .portal-page .custom-navbar .nav li a:hover,
        .portal-page .custom-navbar .nav li.active a { color: var(--portal-blue); }

        .portal-shell { width: min(100% - 40px, 1080px); margin: 0 auto; padding: 128px 0 64px; }
        .portal-hero { padding: 50px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 36px; align-items: center; border: 1px solid rgba(35, 55, 89, 0.07); border-radius: 20px; background: linear-gradient(145deg, #fff 0%, #f5f8ff 100%); box-shadow: 0 18px 48px rgba(38, 58, 96, 0.09); }
        .portal-badge { margin-bottom: 18px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; background: #e8f7f3; color: #147d66; font-size: 13px; font-weight: 700; }
        .portal-hero h1 { margin: 0; font-size: 38px; line-height: 1.3; }
        .portal-hero p { max-width: 650px; margin: 14px 0 26px; color: var(--portal-muted); font-size: 16px; line-height: 1.8; }
        .portal-primary { min-height: 48px; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 10px; background: var(--portal-blue); color: #fff !important; font-size: 15px; font-weight: 600; text-decoration: none; box-shadow: 0 8px 20px rgba(47, 111, 237, 0.2); }
        .portal-primary:hover,
        .portal-primary:focus-visible { background: var(--portal-blue-dark); text-decoration: none; }
        .portal-hero__icon { width: 126px; height: 126px; display: grid; place-items: center; border-radius: 32px; background: #e5eeff; color: var(--portal-blue); font-size: 56px; box-shadow: inset 0 0 0 1px rgba(47, 111, 237, 0.08); }
        .portal-features { margin-top: 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
        .portal-card { min-height: 210px; padding: 28px; display: flex; flex-direction: column; border: 1px solid var(--portal-line); border-radius: 16px; background: #fff; box-shadow: 0 12px 32px rgba(38, 58, 96, 0.06); }
        .portal-card__icon { width: 44px; height: 44px; margin-bottom: 20px; display: grid; place-items: center; border-radius: 12px; background: #eaf1ff; color: var(--portal-blue); font-size: 19px; }
        .portal-card h2 { margin: 0 0 10px; font-size: 19px; }
        .portal-card p { margin: 0 0 20px; color: var(--portal-muted); font-size: 14px; line-height: 1.7; }
        .portal-card a { margin-top: auto; color: var(--portal-blue); font-size: 14px; font-weight: 600; text-decoration: none; }

        @media (max-width: 780px) {
            .portal-shell { width: min(100% - 28px, 1080px); padding: 100px 0 28px; }
            .portal-hero { padding: 34px 26px; grid-template-columns: 1fr; }
            .portal-hero h1 { font-size: 30px; }
            .portal-hero__icon { display: none; }
            .portal-features { grid-template-columns: 1fr; }
            .portal-card { min-height: 0; }
        }
    </style>
</head>
<body class="site-page portal-page" data-spy="scroll" data-target=".navbar-collapse" data-offset="50">
    <div class="preloader">
        <div class="spinner"><span class="spinner-rotate"></span></div>
    </div>

    <div class="navbar custom-navbar navbar-fixed-top" role="navigation">
        <div class="container">
            <div class="navbar-header">
                <button class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse" aria-label="切换导航">
                    <span class="icon icon-bar"></span>
                    <span class="icon icon-bar"></span>
                    <span class="icon icon-bar"></span>
                </button>
                <a href="/welcome.html" class="navbar-brand">My 云盘</a>
            </div>
            <div class="collapse navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    <li class="active"><a href="/welcome.html">欢迎页</a></li>
                    <li><a href="/cloud.html">我的云盘</a></li>
                    <li><a href="/picture.html">图片</a></li>
                    <li><a href="/video.html">视频</a></li>
                    <li><button class="navbar-logout js-logout" type="button"><i class="fa fa-sign-out" aria-hidden="true"></i> 退出登录</button></li>
                </ul>
            </div>
        </div>
    </div>

    <main class="portal-shell">
        <section class="portal-hero" aria-labelledby="welcome-title">
            <div>
                <div class="portal-badge"><i class="fa fa-check-circle" aria-hidden="true"></i> 登录成功</div>
                <h1 id="welcome-title">欢迎回来</h1>
                <p>你的个人内容空间已经准备好。你可以管理云盘文件，也可以继续浏览保存的图片和视频。</p>
                <a class="portal-primary" href="/cloud.html"><i class="fa fa-cloud" aria-hidden="true"></i>进入我的云盘</a>
            </div>
            <div class="portal-hero__icon" aria-hidden="true"><i class="fa fa-folder-open-o"></i></div>
        </section>

        <section class="portal-features" aria-label="功能入口">
            <article class="portal-card">
                <div class="portal-card__icon" aria-hidden="true"><i class="fa fa-cloud-upload"></i></div>
                <h2>个人云盘</h2>
                <p>上传文件，并为已有文件创建带有效期的分享链接。</p>
                <a href="/cloud.html">管理云盘 <i class="fa fa-angle-right" aria-hidden="true"></i></a>
            </article>
            <article class="portal-card">
                <div class="portal-card__icon" aria-hidden="true"><i class="fa fa-picture-o"></i></div>
                <h2>图片</h2>
                <p>查看保存在项目中的图片内容，记录值得留存的瞬间。</p>
                <a href="/picture.html">浏览图片 <i class="fa fa-angle-right" aria-hidden="true"></i></a>
            </article>
            <article class="portal-card">
                <div class="portal-card__icon" aria-hidden="true"><i class="fa fa-play-circle-o"></i></div>
                <h2>视频</h2>
                <p>在响应式播放器中观看服务器提供的视频内容。</p>
                <a href="/video.html">观看视频 <i class="fa fa-angle-right" aria-hidden="true"></i></a>
            </article>
        </section>
    </main>

    <script src="/js/jquery.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/smoothscroll.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/magnific-popup-options.js"></script>
    <script src="/js/wow.min.js"></script>
    <script src="/js/custom.js"></script>
</body>
</html>
