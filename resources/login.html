<!DOCTYPE html>
<html lang="zh-CN">

<head>

     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">

     <title>My 云盘 - 登录</title>
     <link rel="icon" href="/images/favicon.ico">
     <link rel="stylesheet" href="/css/bootstrap.min.css">
     <link rel="stylesheet" href="/css/animate.css">
     <link rel="stylesheet" href="/css/magnific-popup.css">
     <link rel="stylesheet" href="/css/font-awesome.min.css">

     <!-- Main css -->
     <link rel="stylesheet" href="/css/style.css">
     <style>
          body.site-page { background: #f3f6fb; color: #17233d; }
          .site-page .custom-navbar { background: rgba(255, 255, 255, 0.98); box-shadow: 0 10px 32px rgba(38, 58, 96, 0.08); }
          .site-page .custom-navbar .navbar-brand { color: #17233d; font-weight: 700; }
          .site-page .custom-navbar .nav li a { color: #69758a; font-weight: 600; }
          .site-page .custom-navbar .nav li a:hover,
          .site-page .custom-navbar .nav li.active a { color: #2f6fed; }
          .auth-page #home { background: linear-gradient(145deg, #f8fbff 0%, #edf3fd 100%); }
          .auth-card { border: 1px solid rgba(35, 55, 89, 0.08); border-radius: 18px; box-shadow: 0 18px 48px rgba(38, 58, 96, 0.1); }
          .auth-card p { color: #69758a; }
          .auth-card input { border-color: #d9e1ed; border-radius: 10px; background: #fff; }
          .auth-card input:focus { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12); }
          .auth-card button { border-radius: 10px; background: #2f6fed; box-shadow: 0 8px 20px rgba(47, 111, 237, 0.2); }
          .auth-card button:hover { background: #245bd0; }
     </style>

</head>

<body class="site-page auth-page" data-spy="scroll" data-target=".navbar-collapse" data-offset="50">

     <!-- PRE LOADER -->
     <div class="preloader">
          <div class="spinner">
               <span class="spinner-rotate"></span>
          </div>
     </div>


     <!-- NAVIGATION SECTION -->
     <div class="navbar custom-navbar navbar-fixed-top" role="navigation">
          <div class="container">

               <div class="navbar-header">
                    <button class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                         <span class="icon icon-bar"></span>
                         <span class="icon icon-bar"></span>
                         <span class="icon icon-bar"></span>
                    </button>
                    <!-- lOGO TEXT HERE -->
                    <a href="/" class="navbar-brand">My 云盘</a>
               </div>
               <div class="collapse navbar-collapse">
                    <ul class="nav navbar-nav navbar-right">
                         <li class="active"><a class="smoothScroll" href="/login.html">登录</a></li>
                         <li><a class="smoothScroll" href="/register.html">注册</a></li>
                    </ul>
               </div>

          </div>
     </div>
     <!-- HOME SECTION -->
     <section id="home">
          <div class="container">
               <div class="row">
                    <div class="auth-card">
                         <h1 class="wow fadeInUp" data-wow-delay="0.6s">登录</h1>
                         <p>输入账号密码，继续访问你的个人空间。</p>
                         <form action="/login.html" method="post">
                              <label class="sr-only" for="login-username">用户名</label>
                              <div><input id="login-username" type="text" name="username"
                                        autocomplete="username" placeholder="用户名" required></div><br>
                              <label class="sr-only" for="login-password">用户密码</label>
                              <div><input id="login-password" type="password" name="password"
                                        autocomplete="current-password" placeholder="用户密码" required></div><br>
                              <div><button type="submit">确认登录</button></div>
                         </form>
                    </div>
               </div>
          </div>
     </section>
     <!-- SCRIPTS -->
     <script src="/js/jquery.js"></script>
     <script src="/js/bootstrap.min.js"></script>
     <script src="/js/smoothscroll.js"></script>
     <script src="/js/jquery.magnific-popup.min.js"></script>
     <script src="/js/magnific-popup-options.js"></script>
     <script src="/js/wow.min.js"></script>
     <script src="/js/custom.js"></script>
</body>

</html>
