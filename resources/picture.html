<!DOCTYPE html>
<html lang="zh-CN">

<head>

     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">

     <title>My 云盘 - 图片</title>
     <link rel="icon" href="/images/favicon.ico">
     <link rel="stylesheet" href="/css/bootstrap.min.css">
     <link rel="stylesheet" href="/css/animate.css">
     <link rel="stylesheet" href="/css/magnific-popup.css">
     <link rel="stylesheet" href="/css/font-awesome.min.css">

     <!-- Main css -->
     <link rel="stylesheet" href="/css/style.css">
     <style>
          body.picture-page {
               background: #f3f6fb;
               color: #17233d;
          }

          .picture-page .custom-navbar {
               background: rgba(255, 255, 255, 0.98);
               box-shadow: 0 10px 32px rgba(38, 58, 96, 0.08);
          }

          .picture-page .custom-navbar .navbar-brand { color: #17233d; font-weight: 700; }
          .picture-page .custom-navbar .nav li a { color: #69758a; font-weight: 600; }
          .picture-page .custom-navbar .nav li a:hover,
          .picture-page .custom-navbar .nav li.active a { color: #2f6fed; }

          .picture-page #home {
               height: 360px;
               padding-top: 84px;
               background: linear-gradient(145deg, #ffffff 0%, #eef4ff 100%);
          }

          .picture-page #home h1 {
               font-size: 44px;
               margin-bottom: 12px;
          }

          .picture-page #home p {
               max-width: 520px;
               margin: 0;
          }

          .gallery-wrap {
               padding: 28px 15px 72px;
          }

          .picture-list {
               display: flex;
               flex-direction: column;
               align-items: center;
               gap: 34px;
          }

          .picture-card {
               width: min(920px, 94%);
               padding: 18px;
               background: #ffffff;
               border: 1px solid #e5eaf2;
               border-radius: 16px;
               box-shadow: 0 18px 45px rgba(38, 58, 96, 0.09);
          }

          .picture-list img {
               display: block;
               width: 100%;
               max-height: 760px;
               object-fit: contain;
               border-radius: 6px;
          }

          .picture-caption {
               margin: 14px 2px 2px;
               color: #777;
               font-size: 14px;
               letter-spacing: 0.2px;
          }

          @media (max-width: 767px) {
               .picture-page #home {
                    height: 300px;
               }

               .picture-page #home h1 {
                    font-size: 34px;
               }

               .picture-card {
                    width: 96%;
                    padding: 10px;
               }
          }
     </style>

</head>

<body class="site-page picture-page" data-spy="scroll" data-target=".navbar-collapse" data-offset="50">

     <!-- PRE LOADER -->
     <div class="preloader">
          <div class="spinner">
               <span class="spinner-rotate"></span>
          </div>
     </div>

     <!-- NAVIGATION SECTION -->
     <div class="navbar custom-navbar navbar-fixed-top" role="navigation">
          <div class="container">

               <div class="navbar-header">
                    <button class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                         <span class="icon icon-bar"></span>
                         <span class="icon icon-bar"></span>
                         <span class="icon icon-bar"></span>
                    </button>
                    <!-- lOGO TEXT HERE -->
                    <a href="/welcome.html" class="navbar-brand">My 云盘</a>
               </div>

               <div class="collapse navbar-collapse">
                    <ul class="nav navbar-nav navbar-right">
                         <li><a href="/welcome.html">欢迎页</a></li>
                         <li><a href="/cloud.html">我的云盘</a></li>
                         <li class="active"><a href="/picture.html">图片</a></li>
                         <li><a href="/video.html">视频</a></li>
                    </ul>
               </div>
          </div>
     </div>
     <!-- HOME SECTION -->

     <section id="home">
          <div class="container">
               <div class="row">

                    <div class="col-md-offset-1 col-md-2 col-sm-3">
                         <img src="/images/profile-image.my.jpeg" class="wow fadeInUp img-responsive img-circle"
                              data-wow-delay="0.2s" alt="云盘用户头像">
                    </div>

                    <div class="col-md-8 col-sm-8">
                         <h1 class="wow fadeInUp" data-wow-delay="0.6s">图片收藏</h1>
                         <p class="wow fadeInUp" data-wow-delay="0.8s">浏览保存在个人空间里的图片内容。</p>
                    </div>

               </div>
          </div>
     </section>
     <div class="container gallery-wrap">
          <div class="row picture-list">
               <div class="picture-card">
                    <img src="/images/instagram-image.my1.jpeg" alt="云端黄昏">
                    <div class="picture-caption">云端黄昏</div>
               </div>
               <div class="picture-card">
                    <img src="/images/instagram-image.my2.jpeg" alt="城市晚霞">
                    <div class="picture-caption">城市晚霞</div>
               </div>
          </div>
     </div>

     <!-- SCRIPTS -->
     <script src="/js/jquery.js"></script>
     <script src="/js/bootstrap.min.js"></script>
     <script src="/js/smoothscroll.js"></script>
     <script src="/js/jquery.magnific-popup.min.js"></script>
     <script src="/js/magnific-popup-options.js"></script>
     <script src="/js/wow.min.js"></script>
     <script src="/js/custom.js"></script>

</body>

</html>
