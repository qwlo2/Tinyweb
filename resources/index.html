<!DOCTYPE html>
<html lang="zh-CN">

<head>

     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">

     <title>My 云盘 - 首页</title>
     <link rel="icon" href="/images/favicon.ico">
     <link rel="stylesheet" href="/css/bootstrap.min.css">

     <link rel="stylesheet" href="/css/magnific-popup.css">
     <link rel="stylesheet" href="/css/font-awesome.min.css">

     <!-- Main css -->
     <link rel="stylesheet" href="/css/style.css">
     <style>
          body.site-page { background: #f3f6fb; color: #17233d; }
          .site-page .custom-navbar { background: rgba(255, 255, 255, 0.98); box-shadow: 0 10px 32px rgba(38, 58, 96, 0.08); }
          .site-page .custom-navbar .navbar-brand { color: #17233d; font-weight: 700; }
          .site-page .custom-navbar .nav li a { color: #69758a; font-weight: 600; }
          .site-page .custom-navbar .nav li a:hover,
          .site-page .custom-navbar .nav li.active a { color: #2f6fed; }
          .site-page #home { background: linear-gradient(145deg, #ffffff 0%, #eef4ff 100%); }
          .site-page #home img { border: 6px solid #fff; box-shadow: 0 18px 45px rgba(47, 111, 237, 0.16); }
          .site-page .hero-copy p { color: #69758a; line-height: 1.8; }
          .site-button { border-color: #2f6fed; border-radius: 10px; background: #2f6fed; box-shadow: 0 8px 20px rgba(47, 111, 237, 0.2); }
          .site-button:hover { border-color: #245bd0; background: #245bd0; }
          .site-button.secondary { border-color: #d7e1f1; background: #fff; color: #2f6fed !important; }
          .feature-summary { margin: 0 0 28px; color: #69758a; font-size: 14px; letter-spacing: 0.03em; }

</head>

<body class="site-page" data-spy="scroll" data-target=".navbar-collapse" data-offset="50">

     <div class="preloader">
          <div class="spinner">

                    <div class="col-md-offset-1 col-md-2 col-sm-3">
