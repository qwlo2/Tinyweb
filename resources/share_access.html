<!DOCTYPE html>
<html lang="zh-CN">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <title>My 云盘 - 文件分享</title>
     <link rel="icon" href="/images/favicon.ico">
     <link rel="stylesheet" href="/css/bootstrap.min.css">
     <link rel="stylesheet" href="/css/animate.css">
     <link rel="stylesheet" href="/css/magnific-popup.css">
     <link rel="stylesheet" href="/css/font-awesome.min.css">
     <link rel="stylesheet" href="/css/style.css">
</head>

<body class="site-page auth-page share-page" data-spy="scroll" data-target=".navbar-collapse" data-offset="50">
     <div class="preloader">
          <div class="spinner">
               <span class="spinner-rotate"></span>
          </div>
     </div>

     <div class="navbar custom-navbar navbar-fixed-top" role="navigation">
          <div class="container">
               <div class="navbar-header">
                    <button class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                         <span class="icon icon-bar"></span>
                         <span class="icon icon-bar"></span>
                         <span class="icon icon-bar"></span>
                    </button>
                    <a href="/" class="navbar-brand">My 云盘</a>
               </div>
               <div class="collapse navbar-collapse">
                    <ul class="nav navbar-nav navbar-right">
                         <li><a class="smoothScroll" href="/">首页</a></li>
                         <li><a class="smoothScroll" href="/welcome.html">云盘</a></li>
                         <li><a class="smoothScroll" href="/login.html">登录</a></li>
                         <li><a class="smoothScroll" href="/register.html">注册</a></li>
                    </ul>
               </div>
          </div>
     </div>

     <section id="home">
          <div class="container">
               <div class="row">
                    <main class="auth-card share-card">
                         <p class="share-kicker">文件分享</p>
                         <h1>{{SHARE_FILENAME}}</h1>
                         <p class="share-file-size">{{SHARE_FILE_SIZE}}</p>
                         <dl class="share-meta">
                              <dt>分享有效期</dt>
                              <dd>{{SHARE_EXPIRE_TIME}}</dd>
                         </dl>
                         <p class="share-prompt">{{SHARE_PROMPT}}</p>
                         <div class="share-actions">{{SHARE_CONTROLS}}</div>
                    </main>
               </div>
          </div>
     </section>

     <script src="/js/jquery.js"></script>
     <script src="/js/bootstrap.min.js"></script>
     <script src="/js/smoothscroll.js"></script>
     <script src="/js/jquery.magnific-popup.min.js"></script>
     <script src="/js/magnific-popup-options.js"></script>
     <script src="/js/wow.min.js"></script>
     <script src="/js/custom.js"></script>
</body>

</html>
