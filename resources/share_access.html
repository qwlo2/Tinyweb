<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My 云盘 - 分享文件</title>
    <link rel="stylesheet" href="/css/font-awesome.min.css">
    <style>
        :root {
            color-scheme: light;
            --share-blue: #2f6fed;
            --share-blue-dark: #245bd0;
            --share-text: #17233d;
            --share-muted: #69758a;
            --share-line: #e7ecf4;
            --share-bg: #f3f6fb;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--share-bg);
            color: var(--share-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .share-header {
            height: 68px;
            background: #fff;
            border-bottom: 1px solid rgba(23, 35, 61, 0.06);
        }

        .share-header__inner {
            width: min(100% - 40px, 1080px);
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .share-brand {
            color: var(--share-text);
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-decoration: none;
        }

        .share-home-link {
            color: var(--share-muted);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .share-home-link:hover,
        .share-home-link:focus-visible { color: var(--share-blue); }

        .share-nav { display: flex; align-items: center; gap: 22px; }

        .share-shell {
            width: min(100% - 40px, 1080px);
            margin: 0 auto;
            padding: 64px 0;
        }

        .share-panel {
            min-height: 480px;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(340px, 0.85fr);
            overflow: hidden;
            background: #fff;
            border: 1px solid rgba(35, 55, 89, 0.07);
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(38, 58, 96, 0.09);
        }

        .share-file-area,
        .share-action-area { padding: 62px 58px; }

        .share-file-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            background: linear-gradient(145deg, #f8fbff 0%, #f2f6fd 100%);
            border-right: 1px solid var(--share-line);
        }

        .share-file-icon {
            width: 78px;
            height: 78px;
            margin-bottom: 28px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #e6efff;
            color: var(--share-blue);
            font-size: 36px;
            box-shadow: inset 0 0 0 1px rgba(47, 111, 237, 0.08);
        }

        .share-file-area h1,
        .share-action-area h2 { margin: 0; line-height: 1.3; }
        .share-file-area h1 { font-size: 30px; }

        .share-ready {
            margin: 20px 0 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--share-blue-dark);
            font-size: 14px;
            font-weight: 600;
        }

        .share-ready::before {
            width: 8px;
            height: 8px;
            content: "";
            border-radius: 50%;
            background: var(--share-blue);
            box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
        }

        .share-description,
        .share-source,
        .share-action-copy,
        .share-action-hint { color: var(--share-muted); line-height: 1.75; }
        .share-description { margin: 0; font-size: 16px; }

        .share-source {
            margin: 34px 0 0;
            padding-top: 24px;
            border-top: 1px solid rgba(105, 117, 138, 0.16);
            font-size: 13px;
        }

        .share-action-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .share-action-area h2 { font-size: 24px; }
        .share-action-copy { margin: 10px 0 30px; font-size: 14px; }
        .share-form-field { margin-bottom: 20px; }

        .share-form-field label {
            margin-bottom: 9px;
            display: block;
            font-size: 14px;
            font-weight: 600;
        }

        .share-input {
            width: 100%;
            height: 48px;
            padding: 0 15px;
            border: 1px solid #dbe2ee;
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: var(--share-text);
            font: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .share-input::placeholder { color: #a0a9b8; }

        .share-input:focus {
            border-color: var(--share-blue);
            box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12);
        }

        .share-primary-button {
            width: 100%;
            height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            background: var(--share-blue);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(47, 111, 237, 0.22);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .share-primary-button:hover,
        .share-primary-button:focus-visible { background: var(--share-blue-dark); }
        .share-primary-button:active { transform: translateY(1px); }

        .share-action-hint {
            margin: 18px 0 0;
            text-align: center;
            font-size: 12px;
        }

        .share-status {
            margin: 0;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
        }

        .share-status--error {
            background: #fff2f2;
            color: #b42318;
            border: 1px solid #ffd6d2;
        }

        @media (max-width: 760px) {
            .share-header { height: 60px; }
            .share-header__inner,
            .share-shell { width: min(100% - 28px, 1080px); }
            .share-shell { padding: 28px 0; }

            .share-panel {
                min-height: 0;
                grid-template-columns: 1fr;
            }

            .share-file-area,
            .share-action-area { padding: 38px 28px; }

            .share-file-area {
                border-right: 0;
                border-bottom: 1px solid var(--share-line);
            }

            .share-file-icon {
                width: 66px;
                height: 66px;
                margin-bottom: 22px;
                border-radius: 17px;
                font-size: 30px;
            }

            .share-file-area h1 { font-size: 25px; }
            .share-source { margin-top: 26px; padding-top: 18px; }
        }
    </style>
</head>
<body>
    <header class="share-header">
        <div class="share-header__inner">
            <a class="share-brand" href="/">My 云盘</a>
            <nav class="share-nav" aria-label="账户导航">
                <a class="share-home-link" href="/login.html">登录</a>
                <a class="share-home-link" href="/register.html">注册</a>
            </nav>
        </div>
    </header>

    <main class="share-shell">
        <section class="share-panel" aria-label="分享文件访问">
            <div class="share-file-area">
                <div class="share-file-icon" aria-hidden="true">
                    <i class="fa fa-file-o"></i>
                </div>
                <h1>分享文件</h1>
                <p class="share-ready">文件已准备好</p>
                <p class="share-description">登录后即可下载该分享文件</p>
                <p class="share-source">来自 My 云盘的文件分享</p>
            </div>

            <div class="share-action-area">
                <h2>登录后下载</h2>
                <p class="share-action-copy">请使用你的账户完成身份验证</p>
                <p id="share-page-status" class="share-status share-status--error" role="alert" hidden>分享链接无效</p>

                <form id="share-login-form" method="post" hidden>
                    <div class="share-form-field">
                        <label for="share-username">用户名</label>
                        <input id="share-username" class="share-input" name="username"
                            autocomplete="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="share-form-field">
                        <label for="share-password">密码</label>
                        <input id="share-password" class="share-input" name="password" type="password"
                            autocomplete="current-password" placeholder="请输入密码" required>
                    </div>
                    <button class="share-primary-button" type="submit">登录并继续</button>
                    <p class="share-action-hint">登录成功后将进入文件下载页面</p>
                </form>
            </div>
        </section>
    </main>

    <script>
        (() => {
            "use strict";

            const parts = window.location.pathname.split('/').filter(Boolean);
            const tokenPattern = /^[A-Za-z0-9_-]{8,64}$/;
            const isSupportedPath = parts.length === 2 ||
                (parts.length === 3 && parts[2] === "verify");
            const token = parts[0] === "share" && parts[1] &&
                isSupportedPath && tokenPattern.test(parts[1]) ? parts[1] : null;
            const form = document.getElementById("share-login-form");
            const status = document.getElementById("share-page-status");

            if (!token) {
                Array.from(form.elements).forEach((element) => {
                    element.disabled = true;
                });
                status.hidden = false;
                return;
            }

            form.action = `/share/${encodeURIComponent(token)}/login`;
            form.hidden = false;
        })();
    </script>
</body>
</html>
