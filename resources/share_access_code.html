<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My 云盘 - 验证分享</title>
    <link rel="stylesheet" href="/css/font-awesome.min.css">
    <style>
        :root {
            color-scheme: light;
            --share-blue: #2f6fed;
            --share-blue-dark: #245bd0;
            --share-text: #17233d;
            --share-muted: #69758a;
            --share-bg: #f3f6fb;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { min-height: 100%; }

        body {
            margin: 0;
            background: var(--share-bg);
            color: var(--share-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .share-header {
            height: 68px;
            background: #fff;
            border-bottom: 1px solid rgba(23, 35, 61, 0.06);
        }

        .share-header__inner {
            width: min(100% - 40px, 1080px);
            height: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .share-brand {
            color: var(--share-text);
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-decoration: none;
        }

        .share-home-link {
            color: var(--share-muted);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .share-home-link:hover,
        .share-home-link:focus-visible { color: var(--share-blue); }

        .share-nav { display: flex; align-items: center; gap: 22px; }

        .share-shell {
            width: min(100% - 40px, 1080px);
            margin: 0 auto;
            padding: 64px 0;
        }

        .share-panel {
            width: min(100%, 620px);
            margin: 0 auto;
            padding: 58px 64px 48px;
            background: #fff;
            border: 1px solid rgba(35, 55, 89, 0.07);
            border-radius: 18px;
            box-shadow: 0 18px 48px rgba(38, 58, 96, 0.09);
            text-align: center;
        }

        .share-file-icon {
            width: 78px;
            height: 78px;
            margin: 0 auto 26px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #e6efff;
            color: var(--share-blue);
            font-size: 36px;
            box-shadow: inset 0 0 0 1px rgba(47, 111, 237, 0.08);
        }

        .share-panel h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.35;
        }

        .share-description {
            margin: 12px 0 32px;
            color: var(--share-muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .share-form-field { text-align: left; }

        .share-form-field label {
            margin-bottom: 9px;
            display: block;
            font-size: 14px;
            font-weight: 600;
        }

        .share-input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #dbe2ee;
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: var(--share-text);
            font: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .share-input::placeholder { color: #a0a9b8; }

        .share-input:focus {
            border-color: var(--share-blue);
            box-shadow: 0 0 0 3px rgba(47, 111, 237, 0.12);
        }

        .share-primary-button {
            width: 100%;
            height: 50px;
            margin-top: 18px;
            border: 0;
            border-radius: 10px;
            background: var(--share-blue);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(47, 111, 237, 0.22);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .share-primary-button:hover,
        .share-primary-button:focus-visible { background: var(--share-blue-dark); }
        .share-primary-button:active { transform: translateY(1px); }

        .share-hint {
            margin: 22px 0 0;
            color: var(--share-muted);
            font-size: 13px;
        }

        .share-status {
            margin: 0;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
        }

        .share-status--error {
            background: #fff2f2;
            color: #b42318;
            border: 1px solid #ffd6d2;
        }

        @media (max-width: 620px) {
            .share-header { height: 60px; }
            .share-header__inner,
            .share-shell { width: min(100% - 28px, 1080px); }
            .share-shell { padding: 28px 0; }

            .share-panel {
                padding: 40px 26px 34px;
                border-radius: 15px;
            }

            .share-file-icon {
                width: 66px;
                height: 66px;
                margin-bottom: 22px;
                border-radius: 17px;
                font-size: 30px;
            }

            .share-panel h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <header class="share-header">
        <div class="share-header__inner">
            <a class="share-brand" href="/">My 云盘</a>
            <nav class="share-nav" aria-label="账户导航">
                <a class="share-home-link" href="/login.html">登录</a>
                <a class="share-home-link" href="/register.html">注册</a>
            </nav>
        </div>
    </header>

    <main class="share-shell">
        <section class="share-panel" aria-labelledby="share-code-title">
            <div class="share-file-icon" aria-hidden="true">
                <i class="fa fa-file-o"></i>
            </div>
            <h1 id="share-code-title">请输入提取码</h1>
            <p class="share-description">输入分享者提供的提取码后继续访问文件</p>
            <p id="share-page-status" class="share-status share-status--error" role="alert" hidden>分享链接无效</p>

            <form id="share-code-form" method="post" hidden>
                <div class="share-form-field">
                    <label for="share-code">提取码</label>
                    <input id="share-code" class="share-input" name="code"
                        autocomplete="one-time-code" placeholder="请输入提取码"
                        spellcheck="false" required>
                </div>
                <button class="share-primary-button" type="submit">提取文件</button>
                <p class="share-hint">提取码由分享者提供</p>
            </form>
        </section>
    </main>

    <script>
        (() => {
            "use strict";

            const parts = window.location.pathname.split('/').filter(Boolean);
            const tokenPattern = /^[A-Za-z0-9_-]{8,64}$/;
            const token = parts.length === 2 && parts[0] === "share" && parts[1] &&
                tokenPattern.test(parts[1]) ? parts[1] : null;
            const form = document.getElementById("share-code-form");
            const status = document.getElementById("share-page-status");

            if (!token) {
                Array.from(form.elements).forEach((element) => {
                    element.disabled = true;
                });
                status.hidden = false;
                return;
            }

            form.action = `/share/${encodeURIComponent(token)}/verify`;
            form.hidden = false;
        })();
    </script>
</body>
</html>
